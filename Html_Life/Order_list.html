<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Order List</h1> <!---This ordered is also known as Numbered list -->
    <ol type="1" start="100"> <!---the start will only accept the numbers  ;-->
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
    </ol>

    <ol type="A" start="8"> <!--when we want to start from the other aplhabets we can use the numbers -->
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
    </ol>

    <ol type="a" reversed> <!--It will change the formate only not the data -->
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
    </ol>

    <ol type="I">
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
    </ol>

    <ol type="i">
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
    </ol>
    <ol>
        <li>Shireesha</li>
        <li>Shobha</li>
        <li>Renuka</li>
        <li value="50">Renuka</li>
        <li>Renuka</li>
        <li>Renuka</li>
    </ol>

</body>

</html>
