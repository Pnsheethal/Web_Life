<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container1 {
            width: 750px;
            height: 900px;
            border: 5px solid black;
            position: relative;
            padding: 20px;

        }

        .main {
            width: 100px;
            height: 100px;
            border: 3px solid green;
        }

        #box6{
             position: relative;
            left: 2px;

        }

        #box7{
             position: relative;
            left: 660px;
            bottom: 100px;
        }

        #box8{
             position: relative;
            left: 650px;
            top: 600px;
        }

        #box9{
            position: relative;
            top:500px;
        }

        .container {
            width: 500px;
            height: 600px;
            border: 5px solid violet;
            position: relative;
            margin-left: 100px;
            bottom: 290px;
            /* padding: 20px; */
            
        }

        .box {
            width: 100px;
            height: 100px;
            border: 3px solid red;
        }

         #box1 {
            position: relative;
            left: 3px;
        }

        #box2 {
            position: relative;
            left: 390px;
            bottom: 100px;
        }

        #box3 {
            position: relative;
            left: 200px;
            top: 50px;
        }

        #box4 {
            position: relative;
            top: 185px;
            left: 3px;
        }

        #box5 {
            position: relative;
            left: 390px;
            top: 80px;
        }
    </style>
</head>

<body>
    <div class="container1">
        <div class="main" id="box6">box6</div>
        <div class="main" id="box7">box7</div>
        <div class="main" id="box8">box8</div>
        <div class="main" id="box9">box9</div>
        <div class="container">
            <div class="box" id="box1">box1</div>
            <div class="box" id="box2">box2</div>
            <div class="box" id="box3">box3</div>
            <div class="box" id="box4">box4</div>
            <div class="box" id="box5">box5</div>
        </div>
    </div>

</body>

</html>
