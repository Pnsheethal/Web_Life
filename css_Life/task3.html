<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .container{
            width: 500px;
            height: 600px;
            border: 2px solid violet;
            position: relative;
        }

        .box{
            width: 100px;
            height: 100px;
            border: 2px solid red;
        }

        #box1{
            position: relative;
             left: 2px;
        }

        #box2{
            position: relative;
            left: 390px;
            bottom: 100px;
        }

        #box3{
            position: relative;
            left: 200px;
            top: 50px;
        }

        #box4{
            position: relative;
            top: 185px;
            left: 2px;
        }

        #box5{
            position: relative;
            left: 390px;
            top: 85px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
         <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
