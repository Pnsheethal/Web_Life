
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        body {
            background-color: lightgray;
        }

        /* CONTAINER */

        .container {
            width: 80vw;
            margin: auto;
            border: 5px solid black;
            padding: 20px;

            position: relative;
        }

        /* FOUR PAGES */

        .pages {
            width: 100%;
            height: 30vh;
            border: 2px solid red;
            margin-bottom: 20px;
            padding: 10px;
        }

        #box1 {
            background-color: lightblue;
        }

        #box2 {
            background-color: lightgreen;
        }

        #box3 {
            background-color: lightpink;
        }

        #box4 {
            background-color: lightyellow;
        }

        /* CHATBOX INSIDE ALL 4 PAGES */

        .chatbox {
            position: absolute;

            top: 20px;
            bottom: 20px;
            right: 20px;

            width: 200px;

            background-color: white;
            border: 3px solid black;
            border-radius: 10px;

            padding: 15px;
            text-align: center;
        }

        /* SMALL GIF */

        .chatbox img {
            width: 40px;
            height: 40px;
        }

        /* INPUT */

        .chatbox input {
            width: 100%;
            padding: 8px;
            margin-top: 20px;
            border-radius: 20px;
            border: 1px solid black;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="pages" id="box1">
            <h2>Page 1</h2>
        </div>

        <div class="pages" id="box2">
            <h2>Page 2</h2>
        </div>

        <div class="pages" id="box3">
            <h2>Page 3</h2>
        </div>

        <div class="pages" id="box4">
            <h2>Page 4</h2>
        </div>

        <!-- CHATBOX INSIDE CONTAINER -->

        <div class="chatbox">

            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExa2YxajJyeDhwYXA4YzZqeTY1a21vM2IyZ2U5NnZjMmk2Z2t6ZXJtYSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Nc2slkPLPdpmWeCUZc/giphy.gif"
                alt="chatbot">

            <input type="text" placeholder="Hello Sheethal">

        </div>

    </div>

</body>

</html>
